services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: talking-points-summary
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      browserless:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      - ConnectionStrings__TalkingPoints=Host=postgres;Database=talkingpoints;Username=postgres;Password=postgres
      - Ai__Anthropic__ApiKey=${AI_GATEWAY_API_KEY}
      - Ai__Anthropic__BaseUrl=${AI_GATEWAY_BASE_URL:-http://192.168.1.2:4100/anthropic}
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - Browserless__BaseUrl=http://browserless:3000
      - DebugFeatures__Enabled=${DEBUG_FEATURES_ENABLED:-false}
      - Smtp__Host=${SMTP_HOST:-mailpit}
      - Smtp__Port=${SMTP_PORT:-1025}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromEmail=${SMTP_FROM}
      - PipelineSchedule__DayOfWeek=1
      - PipelineSchedule__Hour=8
    volumes:
      - ${TPS_LOGS_PATH:-../runtime-data/logs}:/app/logs

  admin:
    build:
      context: ..
      dockerfile: infra/Dockerfile.admin
    container_name: talking-points-admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__TalkingPoints=Host=postgres;Database=talkingpoints;Username=postgres;Password=postgres
      - DebugFeatures__Enabled=${DEBUG_FEATURES_ENABLED:-false}
      - DataProtection__KeysDirectory=/var/app/data-protection-keys
      - WorkerDebugBaseUrl=http://app:8080/
    volumes:
      - ${ADMIN_DATA_PROTECTION_KEYS_PATH:-../runtime-data/admin-data-protection-keys}:/var/app/data-protection-keys
    ports:
      - "5100:8080"

  postgres:
    image: postgres:15-alpine
    container_name: talkingpoints-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: talkingpoints
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  browserless:
    image: browserless/chrome
    container_name: talkingpoints-browserless
    restart: unless-stopped
    environment:
      - MAX_CONCURRENT_SESSIONS=20
      - CONNECTION_TIMEOUT=60000
      - MAX_QUEUE_LENGTH=100
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: talkingpoints-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: