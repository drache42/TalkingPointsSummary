name: Classify PR

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  classify:
    name: Classify PR semver bump
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Post fork notice
        if: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- semver-bot -->';
            const body = [
              marker,
              '⚠️ **SemVer classification skipped** — this PR is from a fork.',
              'A maintainer must apply one of the following labels manually:',
              '`semver: major`, `semver: minor`, `semver: patch`, or `skip-release`.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Checkout
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        uses: actions/checkout@v6

      - name: Fetch PR diff
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/fetch-pr-diff.ps1

      - name: Classify with Claude
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        id: classify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/classify-pr.ps1

      - name: Apply label and post comment
        if: ${{ github.event.pull_request.head.repo.fork == false }}
        uses: actions/github-script@v7
        env:
          CLASSIFICATION: ${{ steps.classify.outputs.classification }}
          RATIONALE: ${{ steps.classify.outputs.rationale }}
        with:
          script: |
            const classification = process.env.CLASSIFICATION || 'unknown';
            const rationale = process.env.RATIONALE || 'No rationale provided.';

            const labelMap = {
              major: 'semver: major',
              minor: 'semver: minor',
              patch: 'semver: patch',
              unknown: 'semver: unknown',
            };
            const semverLabels = Object.values(labelMap);
            const labelToApply = labelMap[classification] ?? 'semver: unknown';

            // Remove existing semver: * labels except the one we're applying
            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const label of currentLabels) {
              if (semverLabels.includes(label.name) && label.name !== labelToApply) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label.name,
                });
              }
            }

            // Apply label if not already present
            if (!currentLabels.some(l => l.name === labelToApply)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [labelToApply],
              });
            }

            // Post or update bot comment
            const marker = '<!-- semver-bot -->';
            const emojiMap = { major: '🔴', minor: '🟡', patch: '🟢', unknown: '🟠' };
            const emoji = emojiMap[classification] ?? '🟠';
            const body = `${marker}\n${emoji} **SemVer classification:** \`${labelToApply}\`\n\n**Rationale:** ${rationale}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Notify Discord on Dependabot major classification
        if: >-
          ${{ github.event.pull_request.head.repo.fork == false &&
              github.actor == 'dependabot[bot]' &&
              steps.classify.outputs.classification == 'major' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MESSAGE: |
            ⚠️ **Dependabot breaking-change detected** — manual review required before merging.

            PR: ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.html_url }}
        run: .github/scripts/notify-discord.ps1
