name: Main Pipeline

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
      - '!v*.*.*-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-pipeline
  cancel-in-progress: false

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('TalkingPointsSummary.sln', 'Directory.Build.props', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore TalkingPointsSummary.sln

      - name: Build solution
        run: dotnet build TalkingPointsSummary.sln --configuration Release --no-restore

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: >-
          dotnet test tests/TalkingPointsSummary.Tests/TalkingPointsSummary.Tests.csproj
          --configuration Release
          --no-build
          --filter "Category!=Integration"
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory artifacts/test-results/unit

      - name: Run integration tests
        id: integration_tests
        continue-on-error: true
        run: >-
          dotnet test tests/TalkingPointsSummary.IntegrationTests/TalkingPointsSummary.IntegrationTests.csproj
          --configuration Release
          --no-build
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory artifacts/test-results/integration

      - name: Publish test summary
        if: always()
        shell: pwsh
        run: |
          function Get-Count($Counters, [string]$Name) {
            $value = $Counters.$Name
            if ([string]::IsNullOrWhiteSpace("$value")) {
              return 0
            }

            return [int]$value
          }

          $trxFiles = Get-ChildItem -Path artifacts/test-results -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          if (-not $trxFiles) {
            "## Test Results`n`nNo TRX files were produced." | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $rows = New-Object System.Collections.Generic.List[string]
          $total = 0
          $passed = 0
          $failed = 0
          $skipped = 0

          foreach ($trxFile in $trxFiles) {
            [xml]$trx = Get-Content -Path $trxFile.FullName -Raw
            $counters = $trx.TestRun.ResultSummary.Counters

            $fileTotal = Get-Count $counters total
            $filePassed = Get-Count $counters passed
            $fileFailed = (Get-Count $counters failed) + (Get-Count $counters error) + (Get-Count $counters timeout) + (Get-Count $counters aborted)
            $fileSkipped = (Get-Count $counters notExecuted) + (Get-Count $counters notRunnable) + (Get-Count $counters inconclusive)

            $total += $fileTotal
            $passed += $filePassed
            $failed += $fileFailed
            $skipped += $fileSkipped

            $rows.Add("| $($trxFile.BaseName) | $filePassed | $fileFailed | $fileSkipped | $fileTotal |")
          }

          @(
            "## Test Results"
            ""
            "| Suite | Passed | Failed | Skipped | Total |"
            "| --- | ---: | ---: | ---: | ---: |"
            $rows
            ""
            "**Overall:** Passed $passed, Failed $failed, Skipped $skipped, Total $total"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-test-results-${{ github.run_id }}
          path: artifacts/test-results
          if-no-files-found: warn

      - name: Fail workflow on test errors
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.unit_tests.outcome }}' -eq 'failure' -or '${{ steps.integration_tests.outcome }}' -eq 'failure') {
            throw 'One or more test suites failed.'
          }

  compute-version:
    name: Compute next version
    runs-on: ubuntu-latest
    needs:
      - validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.compute.outputs.version }}
      skip: ${{ steps.compute.outputs.skip }}
      short_sha: ${{ steps.compute.outputs.short_sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version
        id: compute
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          echo "Latest tag: ${LATEST_TAG:-none}"

          if [ -z "$LATEST_TAG" ]; then
            MAJOR=1; MINOR=1; PATCH=2
            TAGGED_AT="1970-01-01T00:00:00Z"
          else
            VERSION_STR="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION_STR" | cut -d. -f1)
            MINOR=$(echo "$VERSION_STR" | cut -d. -f2)
            PATCH=$(echo "$VERSION_STR" | cut -d. -f3)
            TAGGED_AT=$(git log -1 --format="%cI" "$LATEST_TAG")
          fi

          echo "Current version: $MAJOR.$MINOR.$PATCH (tagged at $TAGGED_AT)"
          SHORT_SHA="${GITHUB_SHA::7}"

          MERGED_PRS=$(gh api \
            "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&per_page=100" \
            | jq --arg since "$TAGGED_AT" '[.[] | select(.merged_at != null and .merged_at > $since)]')

          PR_COUNT=$(echo "$MERGED_PRS" | jq 'length')
          echo "PRs merged since last tag: $PR_COUNT"

          if [ "$PR_COUNT" -eq 0 ]; then
            echo "No PRs merged since last tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
            echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HAS_MAJOR=false
          HAS_MINOR=false
          HAS_PATCH=false
          HAS_NON_SKIP=false

          while IFS= read -r LABELS_JSON; do
            [ -z "$LABELS_JSON" ] && continue
            if echo "$LABELS_JSON" | grep -q '"semver: major"'; then
              HAS_MAJOR=true; HAS_NON_SKIP=true
            elif echo "$LABELS_JSON" | grep -q '"semver: minor"'; then
              HAS_MINOR=true; HAS_NON_SKIP=true
            elif echo "$LABELS_JSON" | grep -q '"semver: patch"'; then
              HAS_PATCH=true; HAS_NON_SKIP=true
            fi
          done <<< "$(echo "$MERGED_PRS" | jq -c '.[] | [.labels[].name]' 2>/dev/null || true)"

          if [ "$HAS_NON_SKIP" = "false" ]; then
            echo "All merged PRs are skip-release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
            echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HAS_MAJOR" = "true" ]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif [ "$HAS_MINOR" = "true" ]; then
            NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
          else
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "New version: $NEW_VERSION"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

  publish-main-images:
    name: Publish branch images
    runs-on: ubuntu-latest
    needs:
      - validate
      - compute-version
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.compute-version.result == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image names
        id: image_names
        shell: bash
        run: |
          repo_lower=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          short_sha="${GITHUB_SHA::7}"
          echo "worker=ghcr.io/${repo_lower}-worker" >> "$GITHUB_OUTPUT"
          echo "admin=ghcr.io/${repo_lower}-admin" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: |
            ${{ steps.image_names.outputs.worker }}:main
            ${{ steps.image_names.outputs.worker }}:sha-${{ steps.image_names.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=TalkingPointsSummary Worker
          build-args: |
            VERSION=${{ needs.compute-version.outputs.version }}
            COMMIT_SHA=${{ steps.image_names.outputs.short_sha }}
          cache-from: type=gha,scope=worker-image
          cache-to: type=gha,mode=max,scope=worker-image

      - name: Build and push admin image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile.admin
          push: true
          tags: |
            ${{ steps.image_names.outputs.admin }}:main
            ${{ steps.image_names.outputs.admin }}:sha-${{ steps.image_names.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=TalkingPointsSummary Admin
          build-args: |
            VERSION=${{ needs.compute-version.outputs.version }}
            COMMIT_SHA=${{ steps.image_names.outputs.short_sha }}
          cache-from: type=gha,scope=admin-image
          cache-to: type=gha,mode=max,scope=admin-image

  auto-release:
    name: Auto-release
    runs-on: ubuntu-latest
    needs:
      - compute-version
      - publish-main-images
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.compute-version.outputs.skip == 'false' &&
          needs.publish-main-images.result == 'success' }}
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push release tag
        shell: bash
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          git tag -a "v${VERSION}" HEAD -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Compute image names
        id: image_names
        shell: bash
        run: |
          repo_lower=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          short_sha="${{ needs.compute-version.outputs.short_sha }}"
          major_minor="$(echo "${{ needs.compute-version.outputs.version }}" | cut -d. -f1-2)"
          echo "worker=ghcr.io/${repo_lower}-worker" >> "$GITHUB_OUTPUT"
          echo "admin=ghcr.io/${repo_lower}-admin" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote worker image to release tags
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.image_names.outputs.worker }}:${{ needs.compute-version.outputs.version }}" \
            --tag "${{ steps.image_names.outputs.worker }}:${{ steps.image_names.outputs.major_minor }}" \
            --tag "${{ steps.image_names.outputs.worker }}:latest" \
            "${{ steps.image_names.outputs.worker }}:sha-${{ steps.image_names.outputs.short_sha }}"

      - name: Promote admin image to release tags
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.image_names.outputs.admin }}:${{ needs.compute-version.outputs.version }}" \
            --tag "${{ steps.image_names.outputs.admin }}:${{ steps.image_names.outputs.major_minor }}" \
            --tag "${{ steps.image_names.outputs.admin }}:latest" \
            "${{ steps.image_names.outputs.admin }}:sha-${{ steps.image_names.outputs.short_sha }}"

  publish-release-tags:
    name: Promote release tags
    runs-on: ubuntu-latest
    needs:
      - validate
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag commit is on main
        shell: bash
        run: |
          git fetch origin main --depth=1
          if ! git branch -r --contains "$GITHUB_SHA" | grep -Fq "origin/main"; then
            echo "Release tags must point at a commit already contained in origin/main."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release metadata
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match v<major>.<minor>.<patch>."
            exit 1
          fi

          repo_lower=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          short_sha="${GITHUB_SHA::7}"
          major_minor="$(echo "$version" | cut -d. -f1-2)"

          echo "worker=ghcr.io/${repo_lower}-worker" >> "$GITHUB_OUTPUT"
          echo "admin=ghcr.io/${repo_lower}-admin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Verify source branch images exist
        shell: bash
        run: |
          docker buildx imagetools inspect "${{ steps.release.outputs.worker }}:sha-${{ steps.release.outputs.short_sha }}" > /dev/null
          docker buildx imagetools inspect "${{ steps.release.outputs.admin }}:sha-${{ steps.release.outputs.short_sha }}" > /dev/null

      - name: Promote worker image to release tags
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.release.outputs.worker }}:${{ steps.release.outputs.version }}" \
            --tag "${{ steps.release.outputs.worker }}:${{ steps.release.outputs.major_minor }}" \
            --tag "${{ steps.release.outputs.worker }}:latest" \
            "${{ steps.release.outputs.worker }}:sha-${{ steps.release.outputs.short_sha }}"

      - name: Promote admin image to release tags
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.release.outputs.admin }}:${{ steps.release.outputs.version }}" \
            --tag "${{ steps.release.outputs.admin }}:${{ steps.release.outputs.major_minor }}" \
            --tag "${{ steps.release.outputs.admin }}:latest" \
            "${{ steps.release.outputs.admin }}:sha-${{ steps.release.outputs.short_sha }}"

  notify-discord:
    name: Notify Discord on failures
    runs-on: ubuntu-latest
    needs:
      - validate
      - compute-version
      - publish-main-images
      - auto-release
      - publish-release-tags
    if: >-
      ${{ always() && (
        needs.validate.result == 'failure' ||
        needs.compute-version.result == 'failure' ||
        needs.publish-main-images.result == 'failure' ||
        needs.auto-release.result == 'failure' ||
        needs.publish-release-tags.result == 'failure'
      ) }}

    steps:
      - name: Post failure notification
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
            Write-Host 'DISCORD_WEBHOOK_URL is not set. Skipping notification.'
            exit 0
          }

          Write-Output "::add-mask::$env:DISCORD_WEBHOOK_URL"

          $message = @(
            "Main pipeline failed."
            "Repository: ${{ github.repository }}"
            "Ref: ${{ github.ref_name }}"
            "Event: ${{ github.event_name }}"
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ) -join "`n"

          $payload = @{ content = $message } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri $env:DISCORD_WEBHOOK_URL -ContentType 'application/json' -Body $payload | Out-Null