name: Claude Code Review (Comments)

on:
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    name: Review with Claude
    runs-on: ubuntu-latest
    if: >-
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude')
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude')
      )
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the TalkingPointsSummary .NET application.

            Focus on:
            - Correctness and potential bugs
            - Security issues (OWASP Top 10, injection, auth, secrets in code)
            - C# / .NET idioms and best practices
            - Test coverage for new logic
            - Breaking changes to public contracts

            Use mcp__github_inline_comment__create_inline_comment (with confirmed: true)
            to highlight specific code issues inline.
            Use gh pr comment for top-level summary feedback.
            Be concise - flag real issues, not style nitpicks.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
