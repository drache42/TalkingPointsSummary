name: Label Gate

on:
  pull_request:
    types: [opened, labeled, unlabeled, reopened]

permissions:
  pull-requests: read

jobs:
  label-gate:
    name: label-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check semver label
        uses: actions/github-script@v7
        with:
          script: |
            const semverLabels = ['semver: major', 'semver: minor', 'semver: patch'];

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const allLabelNames = labels.map(l => l.name);
            const hasSkipRelease = allLabelNames.includes('skip-release');
            const semverFound = semverLabels.filter(l => allLabelNames.includes(l));

            if (semverFound.length > 1) {
              core.setFailed(
                `PR has multiple semver labels (${semverFound.join(', ')}). Remove all but one.`
              );
            } else if (semverFound.length === 0 && !hasSkipRelease) {
              core.setFailed(
                'PR must have exactly one of: semver: major, semver: minor, semver: patch, or skip-release.'
              );
            } else {
              const active = [...semverFound, ...(hasSkipRelease ? ['skip-release'] : [])];
              core.info(`PR labels OK: ${active.join(' + ')}`);
            }
