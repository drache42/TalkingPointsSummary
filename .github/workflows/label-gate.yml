name: Label Gate

on:
  pull_request:
    types: [opened, labeled, unlabeled, reopened]

permissions:
  pull-requests: read

jobs:
  label-gate:
    name: label-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check semver label
        uses: actions/github-script@v7
        with:
          script: |
            const qualifying = ['semver: major', 'semver: minor', 'semver: patch', 'skip-release'];

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const found = labels.filter(l => qualifying.includes(l.name));

            if (found.length === 1) {
              core.info(`PR has qualifying label: ${found[0].name}`);
            } else if (found.length === 0) {
              core.setFailed(
                'PR must have exactly one of: semver: major, semver: minor, semver: patch, skip-release'
              );
            } else {
              core.setFailed(
                `PR has ${found.length} qualifying labels: ${found.map(l => l.name).join(', ')}. Remove all but one.`
              );
            }
