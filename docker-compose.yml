services:
  app:
    build: .
    container_name: talking-points-summary
    restart: unless-stopped
    environment:
      - CONNECTION_STRING=Host=postgres;Database=talkingpoints;Username=postgres;Password=postgres
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - BROWSERLESS_URL=http://browserless:3000
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      # Schedule: Monday (1) at 8 AM UTC
      - SCHEDULE_DAY=1
      - SCHEDULE_HOUR=8

  # Uncomment if you need a local Postgres instance for development
  # postgres:
  #   image: postgres:16-alpine
