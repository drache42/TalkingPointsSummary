services:
  app:
    build: .
    container_name: talking-points-summary
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      browserless:
        condition: service_healthy
    environment:
      - CONNECTION_STRING=Host=postgres;Database=talkingpoints;Username=postgres;Password=postgres
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - BROWSERLESS_URL=http://browserless:3000
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      # Schedule: Monday (1) at 8 AM UTC
      - SCHEDULE_DAY=1
      - SCHEDULE_HOUR=8

  postgres:
    image: postgres:15-alpine
    container_name: talkingpoints-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: talkingpoints
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  browserless:
    image: browserless/chrome
    container_name: talkingpoints-browserless
    restart: unless-stopped
    environment:
      - MAX_CONCURRENT_SESSIONS=20
      - CONNECTION_TIMEOUT=60000
      - MAX_QUEUE_LENGTH=100
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
