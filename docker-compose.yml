services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talking-points-summary
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      browserless:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      - CONNECTION_STRING=Host=postgres;Database=talkingpoints;Username=postgres;Password=postgres
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - BROWSERLESS_URL=http://browserless:3000
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM}
      # Schedule: Monday (1) at 8 AM UTC
      - SCHEDULE_DAY=1
      - SCHEDULE_HOUR=8
    volumes:
      - ${TPS_LOGS_PATH:-./docker-data/logs}:/app/logs

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: talking-points-admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - CONNECTION_STRING=Host=postgres;Database=talkingpoints;Username=postgres;Password=postgres
    ports:
      - "5100:8080"

  postgres:
    image: postgres:15-alpine
    container_name: talkingpoints-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: talkingpoints
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  browserless:
    image: browserless/chrome
    container_name: talkingpoints-browserless
    restart: unless-stopped
    environment:
      - MAX_CONCURRENT_SESSIONS=20
      - CONNECTION_TIMEOUT=60000
      - MAX_QUEUE_LENGTH=100
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: talkingpoints-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
